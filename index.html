<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flag Football – Playbook</title>
<meta name="description" content="Flag Football im Sportunterricht: Regeln, Technik, Passrouten, Verteidigung, Quiz und ein eigenes digitales Playbook – ohne Anmeldung.">
<meta name="theme-color" content="#0d1b2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flag Playbook">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --nacht: #0d1b2e;
  --nacht2: #14263f;
  --karte: #182d4a;
  --rand: #2a4466;
  --text: #f2f5fa;
  --leise: #a9b8cc;
  --rasen: #2f8f4e;
  --rasen2: #287f44;
  --gelb: #ffd23f;
  --rot: #ef4b4b;
  --blau: #3d8bff;
  --gruen: #36d17c;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  background: var(--nacht); color: var(--text); font-size: 17px; line-height: 1.5;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--gelb); outline-offset: 2px; }
a { color: var(--gelb); }
input, select, textarea { font: inherit; color: var(--text); background: var(--nacht2); border: 1px solid var(--rand); border-radius: 10px; padding: 9px 12px; }
.titel-schrift { font-family: "Arial Black", "Helvetica Neue", Impact, system-ui, sans-serif; text-transform: uppercase; letter-spacing: .02em; }

/* Kopf */
.kopf { position: sticky; top: 0; z-index: 30; background: rgba(13, 27, 46, .95); backdrop-filter: blur(8px); border-bottom: 3px solid var(--gelb); padding-top: env(safe-area-inset-top); }
.kopf-innen { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 8px 14px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 900; white-space: nowrap; }
.logo .flagge { width: 30px; height: 30px; }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-left: auto; }
.nav::-webkit-scrollbar { display: none; }
.nav button { padding: 8px 12px; border-radius: 8px; font-weight: 800; font-size: .9rem; color: var(--leise); white-space: nowrap; }
.nav button.aktiv { background: var(--gelb); color: var(--nacht); }
main { max-width: 1100px; margin: 0 auto; padding: 18px 14px 70px; }
h1 { font-size: clamp(1.8rem, 5vw, 3rem); line-height: 1.05; margin: 0 0 10px; }
h2 { font-size: clamp(1.3rem, 3vw, 1.8rem); margin: 0 0 10px; }
h3 { font-size: 1.1rem; margin: 0 0 6px; }
p { margin: 0 0 10px; }
.leise { color: var(--leise); }
.klein { font-size: .88rem; }
.karte { background: var(--karte); border: 1px solid var(--rand); border-radius: 18px; padding: 18px; margin-bottom: 16px; }
.raster { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.knopf { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 9px 18px; border-radius: 12px; background: var(--gelb); color: var(--nacht); font-weight: 900; }
.knopf:active { transform: translateY(2px); }
.knopf.zweit { background: var(--nacht2); color: var(--text); border: 1px solid var(--rand); }
.knopf.rot { background: var(--rot); color: #fff; }
.knopf.klein { min-height: 38px; padding: 6px 12px; font-size: .9rem; }
.reihe { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.chip { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .75rem; font-weight: 900; text-transform: uppercase; letter-spacing: .05em; background: var(--nacht2); border: 1px solid var(--rand); }
.chip.pass { background: #1f4d8f; border-color: #3d8bff; }
.chip.lauf { background: #7a2e2e; border-color: var(--rot); }
.chip.trick { background: #6b5410; border-color: var(--gelb); }
.chip.eigen { background: #1e5a3a; border-color: var(--gruen); }

/* Start */
.held {
  position: relative; overflow: hidden; border-radius: 22px; padding: 34px 24px; margin-bottom: 20px;
  background: repeating-linear-gradient(90deg, var(--rasen) 0 60px, var(--rasen2) 60px 120px);
  border: 3px solid #fff3;
}
.held::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(13,27,46,.92), rgba(13,27,46,.55) 60%, rgba(13,27,46,.2)); }
.held > * { position: relative; z-index: 1; max-width: 620px; }
.held .gelb { color: var(--gelb); }
.held svg.deko { position: absolute; right: 2%; bottom: -10px; width: min(42%, 380px); z-index: 1; opacity: .95; }
@media (max-width: 760px) { .held svg.deko { width: 120px; right: -14px; bottom: auto; top: -10px; opacity: .35; } }
.module { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.modul { text-align: left; background: var(--karte); border: 1px solid var(--rand); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px; transition: transform .12s, border-color .12s; }
.modul:hover { transform: translateY(-2px); border-color: var(--gelb); }
.modul .nr { font-size: 1.8rem; line-height: 1; }
.modul strong { font-size: 1.05rem; }
.modul span { color: var(--leise); font-size: .9rem; }
.modul.gross { grid-column: span 2; background: linear-gradient(135deg, #1f4d8f, #182d4a); border-color: var(--blau); }
@media (max-width: 520px) { .modul.gross { grid-column: span 1; } }

/* Inhalte */
.liste { padding-left: 1.2em; margin: 6px 0; }
.liste li { margin: 4px 0; }
table.tab { width: 100%; border-collapse: collapse; }
.tab th, .tab td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--rand); vertical-align: top; }
.tab th { color: var(--gelb); font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; }
.punkt-zahl { font-size: 1.6rem; font-weight: 900; color: var(--gelb); }
.nono { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); padding: 0; list-style: none; }
.nono li { background: #3a1f28; border: 1px solid #6b2f3a; border-radius: 12px; padding: 10px 12px; }
.nono li::before { content: "✋ "; }
.schritte { counter-reset: s; list-style: none; padding: 0; display: grid; gap: 8px; }
.schritte li { counter-increment: s; position: relative; padding: 10px 12px 10px 48px; background: var(--nacht2); border-radius: 12px; }
.schritte li::before { content: counter(s); position: absolute; left: 12px; top: 10px; width: 26px; height: 26px; border-radius: 50%; background: var(--gelb); color: var(--nacht); font-weight: 900; display: grid; place-items: center; font-size: .9rem; }
.zwei { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.plus li::marker { content: "＋ "; color: var(--gruen); }
.minus li::marker { content: "－ "; color: var(--rot); }

/* Spielfeld */
.feld { width: 100%; height: auto; display: block; border-radius: 12px; touch-action: none; }
.routen-raster { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.route-karte { background: var(--karte); border: 1px solid var(--rand); border-radius: 14px; padding: 10px; text-align: center; }
.route-karte h3 { margin: 6px 0 2px; }
.route-karte p { font-size: .85rem; color: var(--leise); margin: 0; }

/* Playbook */
.pb-kopf { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; }
.code { font-family: ui-monospace, Menlo, monospace; font-weight: 900; font-size: 1.3rem; color: var(--gelb); letter-spacing: .04em; background: var(--nacht2); border: 2px dashed var(--gelb); border-radius: 10px; padding: 4px 12px; }
.tabs { display: flex; gap: 6px; margin: 14px 0; flex-wrap: wrap; }
.tabs button { padding: 9px 16px; border-radius: 10px; background: var(--nacht2); border: 1px solid var(--rand); font-weight: 800; }
.tabs button.aktiv { background: var(--blau); border-color: var(--blau); }
.spielzuege { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.spielzug { background: var(--karte); border: 1px solid var(--rand); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.spielzug .kopfzeile { display: flex; align-items: center; gap: 8px; }
.spielzug .nummer { flex: none; width: 30px; height: 30px; border-radius: 8px; background: var(--gelb); color: var(--nacht); font-weight: 900; display: grid; place-items: center; }
.spielzug .name { font-weight: 900; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spielzug .aktionen { display: flex; flex-wrap: wrap; gap: 6px; }
.spielzug .aktionen button { flex: 1; min-width: 40px; min-height: 38px; border-radius: 9px; background: var(--nacht2); border: 1px solid var(--rand); font-size: .9rem; font-weight: 700; }
.spielzug .aktionen button.haupt { background: var(--gelb); color: var(--nacht); border-color: var(--gelb); }
.spielzug.drin { border-color: var(--gruen); }
.leer-hinweis { text-align: center; padding: 30px 16px; border: 2px dashed var(--rand); border-radius: 16px; color: var(--leise); }

/* Editor */
.editor { display: grid; grid-template-columns: 1fr 300px; gap: 16px; align-items: start; }
.werkzeuge { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.werkzeuge button { min-height: 44px; border-radius: 10px; background: var(--nacht2); border: 1px solid var(--rand); font-weight: 700; font-size: .9rem; padding: 6px; text-align: left; }
.werkzeuge button.aktiv { background: var(--blau); border-color: var(--blau); }
.hinweisbox { background: var(--nacht2); border-left: 4px solid var(--gelb); border-radius: 8px; padding: 8px 12px; font-size: .9rem; margin: 10px 0; }
.legende { display: flex; flex-wrap: wrap; gap: 14px; font-size: .85rem; color: var(--leise); margin-top: 8px; }
.legende svg { vertical-align: middle; }

/* Overlay */
.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(5, 12, 22, .92); display: none; align-items: center; justify-content: center; padding: 16px; }
.overlay.an { display: flex; }
.overlay .innen { width: min(100%, 960px); max-height: 100%; overflow: auto; }
.huddle .titelzeile { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.huddle .nummer { font-size: 2.4rem; font-weight: 900; color: var(--gelb); }
.huddle .name { font-size: clamp(1.4rem, 4vw, 2.4rem); font-weight: 900; flex: 1; }
.qr { background: #fff; padding: 12px; border-radius: 12px; display: inline-block; }
.qr svg, .qr img { display: block; width: min(70vw, 300px); height: auto; }

/* Quiz */
.optionen { display: grid; gap: 10px; margin-top: 12px; }
.option { text-align: left; padding: 14px 16px; border-radius: 12px; background: var(--nacht2); border: 2px solid var(--rand); font-weight: 700; }
.option.richtig { border-color: var(--gruen); background: #164a30; }
.option.falsch { border-color: var(--rot); background: #4a1c1c; }
.rueckmeldung { margin-top: 12px; padding: 12px 14px; border-radius: 12px; }
.rueckmeldung.gut { background: #164a30; }
.rueckmeldung.schlecht { background: #4a1c1c; }
.balken { height: 8px; background: var(--nacht2); border-radius: 99px; overflow: hidden; margin: 8px 0 14px; }
.balken i { display: block; height: 100%; background: var(--gelb); }

/* Video */
.video { aspect-ratio: 16 / 9; background: #000; border-radius: 14px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; position: relative; overflow: hidden; }
.video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

/* Glossar */
.glossar dt { font-weight: 900; color: var(--gelb); margin-top: 10px; }
.glossar dd { margin: 2px 0 0; color: var(--text); }

#druck { display: none; }
@media print {
  body { background: #fff; color: #000; }
  .kopf, main, .overlay { display: none !important; }
  #druck { display: block; }
  #druck .karten { display: grid; grid-template-columns: 1fr 1fr; gap: 10mm; }
  #druck .dk { border: 2px solid #000; border-radius: 4mm; padding: 4mm; break-inside: avoid; }
  #druck h2 { margin: 0 0 6mm; font-size: 16pt; }
  #druck .dk h3 { margin: 0 0 2mm; font-size: 13pt; }
}
@media (max-width: 820px) {
  .editor { grid-template-columns: 1fr; }
  .logo .text { display: none; }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); }
  .tabs button { padding: 8px 6px; font-size: .8rem; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="kopf">
  <div class="kopf-innen">
    <button class="logo" id="logo" aria-label="Zur Startseite">
      <svg class="flagge" viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="16" cy="16" rx="14" ry="9" transform="rotate(-35 16 16)" fill="#8a4b22" stroke="#fff" stroke-width="1.5"/><path d="M10 20 L22 12 M13 19 l-1.5-2 M16 17 l-1.5-2 M19 15 l-1.5-2" stroke="#fff" stroke-width="1.5"/></svg>
      <span class="text titel-schrift">Flag Football</span>
    </button>
    <nav class="nav" id="nav"></nav>
  </div>
</header>
<main id="bild"></main>
<div class="overlay" id="overlay"></div>
<footer style="text-align:center;padding:0 14px 30px" class="klein leise"><button id="impLink" style="text-decoration:underline">Impressum &amp; Datenschutz</button></footer>
<div id="druck"></div>

<script>
'use strict';
// =====================================================================
//  Flag Football – Lernseite und digitales Playbook
//  Inhalte nach: AFVH-Reader „Einführung in das Flagfootball-Spiel“
//  und „Einfaches Playbook“ (flag-coaching.info).
//  Playbooks werden nur auf dem Gerät und im Link/QR-Code gespeichert.
// =====================================================================

const bild = document.getElementById('bild');
const overlay = document.getElementById('overlay');
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const kopie = (o) => JSON.parse(JSON.stringify(o));

// ---------- Spielfeld-Koordinaten ----------
// Feld 100 breit × 80 hoch. Angriff spielt nach oben. Line of Scrimmage (LOS) bei y = 52.
const LOS = 52;
const ROLLEN = { C: 'Center', QB: 'Quarterback', RB: 'Runningback', WR: 'Receiver', DB: 'Verteidiger*in' };

// Spielzug-Format: s = Spieler*innen [Rolle, x, y, Zone?], w = Wege [Spieler-Index, Art, Punkte, glatt],
// Art: l = Laufweg ohne Ball, b = Laufweg mit Ball, p = Passweg; m = Marker [h = Ballübergabe | f = Täuschung, x, y]
const STANDARD = () => ({ s: [['WR', 15, 56], ['C', 50, 56], ['WR', 85, 56], ['QB', 50, 65], ['RB', 50, 74]], w: [], m: [] });

const BIBLIOTHEK = [
  // --- aus dem AFVH-Reader ---
  { id: 'r1', name: 'Lauf rechts', typ: 'lauf', quelle: 'Reader', info: 'Alle Receiver laufen tief und ziehen die Verteidigung mit. Der RB bekommt den Ball per Hand Off und läuft rechts durch die Lücke.',
    s: [['WR', 15, 56], ['C', 50, 56], ['WR', 85, 56], ['QB', 50, 65], ['RB', 50, 74]],
    w: [[0, 'l', [[15, 56], [15, 14]]], [1, 'l', [[50, 52], [50, 14]]], [2, 'l', [[85, 56], [85, 14]]], [3, 'l', [[50, 65], [63, 70]]],
      [4, 'l', [[50, 74], [55, 70]], 1], [4, 'b', [[55, 70], [57, 62], [57, 40]], 1]], m: [['h', 55, 69]] },
  { id: 'r2', name: 'Fake Lauf – Pass', typ: 'trick', quelle: 'Reader', info: 'Der QB täuscht die Übergabe an den RB an und rollt mit dem Ball nach links. Anspielstationen: Curl links, Out vom Center, Corner rechts.',
    s: [['WR', 15, 56], ['C', 50, 56], ['WR', 85, 56], ['QB', 50, 65], ['RB', 50, 74]],
    w: [[0, 'l', [[15, 56], [15, 18], [18, 16], [19, 24]], 1], [1, 'l', [[50, 52], [50, 36], [22, 36]]], [2, 'l', [[85, 56], [85, 38], [62, 10]]],
      [3, 'b', [[50, 65], [55, 68], [53, 71], [28, 71]], 1], [4, 'l', [[50, 74], [56, 69], [57, 60], [57, 44]], 1]], m: [['f', 55, 68]] },
  { id: 'r3', name: 'Fake Reverse – Pass', typ: 'trick', quelle: 'Reader', info: 'Der rechte Receiver läuft hinter dem QB vorbei (angetäuschter Reverse). Danach Pass auf Post, Slant oder Out.',
    s: [['WR', 15, 56], ['WR', 32, 56], ['C', 50, 56], ['WR', 85, 56], ['QB', 50, 65]],
    w: [[0, 'l', [[15, 56], [15, 32], [42, 10]]], [1, 'l', [[32, 56], [68, 14]]], [2, 'l', [[50, 52], [50, 38], [72, 38]]],
      [3, 'l', [[85, 56], [80, 66], [70, 72], [45, 75]], 1], [4, 'l', [[50, 65], [63, 70]]]], m: [['f', 62, 70]] },
  { id: 'r4', name: 'Fake Lauf – Reverse', typ: 'trick', quelle: 'Reader', info: 'Der RB täuscht einen Lauf an. Den Ball bekommt aber der rechte Wing per Hand Off – er läuft auf die andere Seite.',
    s: [['WR', 15, 56], ['C', 50, 56], ['RB', 85, 56], ['QB', 50, 65], ['RB', 50, 74]],
    w: [[0, 'l', [[15, 56], [15, 14]]], [1, 'l', [[50, 52], [50, 14]]], [2, 'l', [[85, 56], [80, 66], [64, 70]], 1], [2, 'b', [[64, 70], [45, 74], [28, 66], [22, 44]], 1],
      [3, 'l', [[50, 65], [63, 70]]], [4, 'l', [[50, 74], [56, 69], [57, 60], [57, 44]], 1]], m: [['f', 55, 68], ['h', 64, 70]] },
  { id: 'r5', name: 'Pass – All Curl', typ: 'pass', quelle: 'Reader', info: 'Alle laufen nach vorne und drehen sich zum QB um (Curl). Sicherer, kurzer Pass.',
    s: [['WR', 15, 56], ['WR', 32, 56], ['C', 50, 56], ['WR', 85, 56], ['QB', 50, 65]],
    w: [[0, 'l', [[15, 56], [15, 22], [18, 19], [19, 27]], 1], [1, 'l', [[32, 56], [32, 22], [35, 19], [36, 27]], 1], [2, 'l', [[50, 52], [50, 22], [53, 19], [54, 27]], 1], [3, 'l', [[85, 56], [85, 22], [82, 19], [81, 27]], 1]], m: [] },
  { id: 'r6', name: 'Pass – All Curl & Fly', typ: 'pass', quelle: 'Reader', info: 'Alle täuschen einen Curl an und starten dann tief durch (Fly). Gut gegen eine Verteidigung, die auf Curls wartet.',
    s: [['WR', 15, 56], ['WR', 32, 56], ['C', 50, 56], ['WR', 85, 56], ['QB', 50, 65]],
    w: [[0, 'l', [[15, 56], [15, 34], [19, 40], [19, 8]]], [1, 'l', [[32, 56], [32, 34], [36, 40], [36, 8]]], [2, 'l', [[50, 52], [50, 34], [54, 40], [54, 8]]], [3, 'l', [[85, 56], [85, 34], [81, 40], [81, 8]]]], m: [] },
  { id: 'r7', name: 'Pass – Curl, Corner, Fly, In', typ: 'pass', quelle: 'Reader', info: 'Vier verschiedene Routen auf mehreren Höhen – die Verteidigung kann nicht alles decken.',
    s: [['WR', 15, 56], ['C', 50, 56], ['WR', 68, 56], ['WR', 85, 56], ['QB', 50, 65]],
    w: [[0, 'l', [[15, 56], [15, 20], [18, 17], [19, 25]], 1], [1, 'l', [[50, 52], [50, 36], [25, 12]]], [2, 'l', [[68, 56], [68, 10]]], [3, 'l', [[85, 56], [85, 38], [56, 38]]]], m: [] },
  { id: 'r8', name: 'Pass – Post, Slant, Corner, Hitch', typ: 'pass', quelle: 'Reader', info: 'Post und Corner kreuzen sich in der Tiefe, der Slant geht schnell nach innen, der Hitch ist der kurze Notfall-Pass.',
    s: [['WR', 15, 56], ['WR', 32, 56], ['C', 50, 56], ['WR', 85, 56], ['QB', 50, 65]],
    w: [[0, 'l', [[15, 56], [15, 32], [45, 8]]], [1, 'l', [[32, 56], [70, 18]]], [2, 'l', [[50, 52], [50, 30], [20, 8]]], [3, 'l', [[85, 56], [85, 46], [82, 49]]]], m: [] },
  { id: 'r9', name: 'Motion Pass – Post, Out, Up & Fly, Slant', typ: 'pass', quelle: 'Reader', info: 'Ein Receiver wechselt vor dem Snap hinter dem QB die Seite (Motion) und startet dann diagonal und tief.',
    s: [['WR', 15, 56], ['WR', 32, 56], ['C', 50, 56], ['WR', 85, 56], ['QB', 50, 65]],

  // --- aus „Einfaches Playbook“ (flag-coaching.info) ---
  { id: 'e1', name: 'Fly, Out, In + RB links', typ: 'pass', quelle: 'Einfaches Playbook', info: 'Links tief (Fly), der Center läuft ein Out nach rechts, rechts ein In. Der RB läuft als kurze Anspielstation nach links.',
    s: [['WR', 15, 56], ['C', 50, 56], ['WR', 85, 56], ['RB', 38, 68], ['QB', 50, 68]],

function glaetten(punkte) {
  if (punkte.length < 3) return punkte.map(p => [...p]);
  const out = [];
  for (let i = 0; i < punkte.length - 1; i++) {
    const p0 = punkte[i - 1] || punkte[i], p1 = punkte[i], p2 = punkte[i + 1], p3 = punkte[i + 2] || p2;
    for (let k = 0; k < 10; k++) {
      const t = k / 10, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map(j => 0.5 * ((2 * p1[j]) + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3)));
    }
  }
  out.push([...punkte[punkte.length - 1]]);
  return out;
}
const wegPunkte = (w) => (w[3] ? glaetten(w[2]) : w[2]);
const r1 = (n) => Math.round(n * 10) / 10;

// ---------- Animation ----------
function laenge(pts) { let l = 0; for (let i = 1; i < pts.length; i++) l += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return l; }
function punktBei(pts, d) {
  for (let i = 1; i < pts.length; i++) {
    const seg = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    if (d <= seg) { const t = seg ? d / seg : 0; return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t]; }
    d -= seg;
  }
  return pts[pts.length - 1];
}
const laeufe = new WeakMap();
function animieren(svg, spiel) {
  if (!svg) return;
  if (laeufe.get(svg)) cancelAnimationFrame(laeufe.get(svg));
  const TEMPO = 18, START = 0.5;               // Feldeinheiten pro Sekunde, Snap-Zeit
  const qbI = spiel.s.findIndex(sp => sp[0] === 'QB'), cI = spiel.s.findIndex(sp => sp[0] === 'C');
  const pfade = spiel.s.map((sp, i) => {
    const teile = spiel.w.filter(w => w[0] === i && w[1] !== 'p');
    let pts = [[sp[1], sp[2]]], ballAb = null;
    for (const w of teile) {
      const p = wegPunkte(w);
      if (w[1] === 'b' && ballAb === null) ballAb = laenge(pts);
      pts = pts.concat(p);
    }
    return { pts, len: laenge(pts), ballAb };
  });
  const pass = spiel.w.find(w => w[1] === 'p');
  const ballLaeufer = pfade.findIndex(p => p.ballAb !== null);
  let ball = svg.querySelector('.anim-ball');
  if (!ball) { svg.insertAdjacentHTML('beforeend', '<ellipse class="anim-ball" rx="1.6" ry="1" fill="#8a4b22" stroke="#fff" stroke-width=".3"/>'); ball = svg.querySelector('.anim-ball'); }
  const start = svg.querySelector('.ball-start'); if (start) start.style.display = 'none';
  const gruppen = [...svg.querySelectorAll('.sp')];
  const dauer = Math.max(...pfade.map(p => START + p.len / TEMPO), pass ? 3.2 : 2) + 0.6;
  const t0 = performance.now();
  const qbPos = (t) => { const p = pfade[qbI]; return p ? punktBei(p.pts, Math.max(0, t - START) * TEMPO) : [50, 65]; };
  const schritt = (jetzt) => {
    const t = (jetzt - t0) / 1000;
    gruppen.forEach((g) => {
      const i = +g.dataset.s, p = pfade[i];
      const pos = punktBei(p.pts, Math.max(0, t - START) * TEMPO);
      g.setAttribute('transform', `translate(${r1(pos[0])} ${r1(pos[1])})`);
    });
    // Ball: Snap vom Center zum QB, dann Pass oder mit dem Ballträger
    let bp;
    const cPos = cI >= 0 ? [spiel.s[cI][1], spiel.s[cI][2] - 4.6] : [50, LOS];
    if (t < START) { const q = qbPos(0); const k = t / START; bp = [cPos[0] + (q[0] - cPos[0]) * k, cPos[1] + (q[1] - cPos[1]) * k]; }
    else if (pass && t >= 1.6) {
      const k = Math.min(1, (t - 1.6) / 0.7), von = qbPos(1.6), nach = pass[2][pass[2].length - 1];
      bp = [von[0] + (nach[0] - von[0]) * k, von[1] + (nach[1] - von[1]) * k - Math.sin(k * Math.PI) * 4];
    } else if (!pass && ballLaeufer >= 0) {
      const p = pfade[ballLaeufer], d = Math.max(0, t - START) * TEMPO;
      bp = d >= p.ballAb ? punktBei(p.pts, d) : qbPos(t);
    } else bp = qbPos(t);
    ball.setAttribute('cx', r1(bp[0])); ball.setAttribute('cy', r1(bp[1]));
    if (t < dauer) laeufe.set(svg, requestAnimationFrame(schritt));
    else { gruppen.forEach((g) => { const sp = spiel.s[+g.dataset.s]; g.setAttribute('transform', `translate(${sp[1]} ${sp[2]})`); }); ball.setAttribute('cx', -10); if (start) start.style.display = ''; }
  };
  laeufe.set(svg, requestAnimationFrame(schritt));
}

function sichern() { try { localStorage.setItem(SPEICHER, JSON.stringify(D)); } catch { /* privates Fenster */ } }
const ADJ = ['BLITZ', 'TURBO', 'SILBER', 'NEON', 'STURM', 'GOLD', 'ROT', 'WILD', 'KOBALT', 'FLINK', 'LASER', 'NORD', 'SONNEN', 'NACHT', 'EIS'];

// Playbook als kompakter Link (komprimiert, Base64url)
const b64 = (bytes) => btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64 = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
async function packen(pb) {
  const daten = JSON.stringify({ c: pb.code, n: pb.team, s: pb.spiele.map(e => e.d ? { t: e.t, d: { name: e.d.name, typ: e.d.typ, s: e.d.s, w: e.d.w, m: e.d.m, info: e.d.info } } : { t: e.t, l: e.l }) });
  const roh = new TextEncoder().encode(daten);
  if ('CompressionStream' in window) {
    try {
      const st = new Blob([roh]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      return 'z' + b64(new Uint8Array(await new Response(st).arrayBuffer()));
    } catch { /* ohne Kompression */ }
  }
  return 'j' + b64(roh);
}
async function entpacken(s) {
  const bytes = unb64(s.slice(1));
  let text;
  if (s[0] === 'z') text = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  else text = new TextDecoder().decode(bytes);
  const o = JSON.parse(text);
  return { code: o.c, team: o.n || '', spiele: (o.s || []).filter(e => e.l ? bibliothek(e.l) : e.d).map(e => ({ ...e })), geaendert: Date.now() };
}
async function linkErzeugen(pb) { return `${location.origin}${location.pathname}#pb=${await packen(pb)}`; }

  $('#huddle').onclick = () => huddle(0);
  $('#drucken').onclick = drucken;
  $('#verwalten').onclick = verwaltenDialog;
  const inhalt = $('#pbInhalt');
  if (pbTab === 'bib') bibliothekZeigen(inhalt, pb);
  else if (pbTab === 'neu') editor(inhalt, null);
  else meinPlaybook(inhalt, pb);
}

function karteHtml(e, i, aktionen, drin) {
  const d = spielDaten(e);
  const typ = spielTyp(e);
  const typName = { pass: 'Pass', lauf: 'Lauf', trick: 'Trick', eigen: 'Eigener', defense: 'Defense' }[typ] || typ;
  return `<div class="spielzug ${drin ? 'drin' : ''}" data-i="${i}">
    <div class="kopfzeile">${aktionen !== 'bib' ? `<span class="nummer">${i + 1}</span>` : ''}<span class="name" title="${esc(spielName(e))}">${esc(spielName(e))}</span><span class="chip ${typ}">${typName}</span></div>
    ${feld(d, { klein: 1, label: spielName(e) })}
    ${d.info ? `<p class="klein leise" style="margin:0">${esc(d.info)}</p>` : ''}
    <div class="aktionen">${aktionen === 'bib'
      ? `<button data-a="play" aria-label="Abspielen">▶</button><button data-a="add" class="haupt">${drin ? '✓ Drin – nochmal' : '+ Ins Playbook'}</button>`
      : `<button data-a="play" aria-label="Abspielen">▶</button><button data-a="name" aria-label="Umbenennen">✏️ Name</button><button data-a="edit" aria-label="Bearbeiten">🖊 Wege</button><button data-a="hoch" aria-label="Nach vorne">▲</button><button data-a="runter" aria-label="Nach hinten">▼</button><button data-a="weg" aria-label="Entfernen">🗑</button>`}</div>
  </div>`;
}

function meinPlaybook(el, pb) {
  if (!pb.spiele.length) {
    el.innerHTML = `<div class="leer-hinweis"><p><b>Euer Playbook ist noch leer.</b></p><p>Sucht euch in der Bibliothek passende Spielzüge aus oder zeichnet eigene.</p>
      <div class="reihe" style="justify-content:center"><button class="knopf" id="zurBib">📚 Zur Bibliothek</button><button class="knopf zweit" id="zumEditor">✏️ Selbst zeichnen</button></div></div>`;
    $('#zurBib').onclick = () => { pbTab = 'bib'; playbookSeite(); };
    $('#zumEditor').onclick = () => { pbTab = 'neu'; playbookSeite(); };
    return;
  }
  el.innerHTML = `${LEGENDE}<div class="spielzuege" style="margin-top:12px">${pb.spiele.map((e, i) => karteHtml(e, i, 'mein')).join('')}</div>`;
  el.querySelectorAll('.spielzug').forEach(k => {
    const i = +k.dataset.i, e = pb.spiele[i];
    k.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
      const a = b.dataset.a;
      if (a === 'play') return animieren(k.querySelector('svg'), spielDaten(e));
      if (a === 'name') {
        const neu = prompt('Neuer Name für den Spielzug:', spielName(e));
        if (neu && neu.trim()) e.t = neu.trim().slice(0, 40);
      }
      if (a === 'edit') return editor($('#pbInhalt'), i);
      if (a === 'hoch' && i > 0) [pb.spiele[i - 1], pb.spiele[i]] = [pb.spiele[i], pb.spiele[i - 1]];
      if (a === 'runter' && i < pb.spiele.length - 1) [pb.spiele[i + 1], pb.spiele[i]] = [pb.spiele[i], pb.spiele[i + 1]];
      if (a === 'weg' && confirm(`„${spielName(e)}“ aus dem Playbook entfernen?`)) pb.spiele.splice(i, 1);
      pb.geaendert = Date.now(); sichern(); playbookSeite();
    });
  });
}

function bibliothekZeigen(el, pb) {
  let filter = 'alle';
  const zeichnen = () => {
    const liste = BIBLIOTHEK.filter(b => filter === 'alle' || b.typ === filter);
    el.innerHTML = `
      <div class="reihe" style="margin-bottom:10px">${[['alle', 'Alle'], ['pass', 'Pass'], ['lauf', 'Lauf'], ['trick', 'Trick']].map(([f, t]) => `<button class="knopf klein ${f === filter ? '' : 'zweit'}" data-f="${f}">${t}</button>`).join('')}</div>
      ${LEGENDE}
      <div class="spielzuege" style="margin-top:12px">${liste.map(b => karteHtml({ l: b.id }, BIBLIOTHEK.indexOf(b), 'bib', pb.spiele.some(e => e.l === b.id))).join('')}</div>
      <p class="klein leise" style="margin-top:14px">Quellen: AFVH-Reader „Einführung in das Flagfootball-Spiel“ (Spielzüge r1–r9) und „Einfaches Playbook“, flag-coaching.info (6 Spielzüge), für diese Seite nachgezeichnet.</p>`;
    el.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; zeichnen(); });

}

// ---------- Editor ----------
function editor(el, index) {
  const pb = aktuellesPB();
  const e = index !== null ? pb.spiele[index] : null;
  const basis = e ? spielDaten(e) : STANDARD();
  let spiel = kopie({ s: basis.s, w: basis.w, m: basis.m || [] });
  let name = e ? spielName(e) : '';
  let typ = e ? (spielTyp(e) === 'eigen' ? 'pass' : spielTyp(e)) : 'pass';
  let notiz = e ? (basis.info || '') : '';
  let werkzeug = 'lauf', rolle = 'WR';
  const verlauf = [];
  const merken = () => { verlauf.push(JSON.stringify(spiel)); if (verlauf.length > 40) verlauf.shift(); };
  const WERKZEUGE = [
    ['bewegen', '✋ Verschieben'], ['lauf', '➡️ Laufweg'], ['ball', '🏈 Lauf mit Ball'], ['pass', '🎯 Pass'],
    ['h', '‖ Ballübergabe'], ['f', '| Täuschung'], ['spieler', '➕ Person setzen'], ['zone', '⭕ Zone an/aus'], ['loeschen', '🗑 Löschen'],
  ];
  const TIPPS = {
    bewegen: 'Ziehe eine Person an eine neue Stelle. Ihre Wege wandern mit.',
    lauf: 'Lege den Finger auf eine Person und zeichne ihren Laufweg.',
    ball: 'Zeichne den Laufweg mit Ball – z. B. für den RB nach der Übergabe.',
    pass: 'Zeichne vom QB aus, wohin der Ball geworfen wird.',
    h: 'Tippe an die Stelle der Ballübergabe (Hand Off).',
    f: 'Tippe an die Stelle der angetäuschten Übergabe.',
    spieler: 'Wähle die Rolle und tippe aufs Feld. DB = Verteidiger*in.',
    zone: 'Tippe auf eine verteidigende Person (DB), um ihre Zone ein- oder auszublenden.',
    loeschen: 'Tippe auf eine Person, einen Weg oder eine Markierung, um sie zu löschen.',
  };
  el.innerHTML = `
    <div class="editor">
      <div><div id="feldBox"></div>${LEGENDE}</div>
      <div class="karte" style="margin:0">
        <label class="klein leise" for="spName">Name des Spielzugs</label>
        <input id="spName" value="${esc(name)}" placeholder="z. B. Blitz-Falke" maxlength="40" style="width:100%;margin-bottom:8px">
        <label class="klein leise" for="spTyp">Art</label>
        <select id="spTyp" style="width:100%;margin-bottom:10px">${[['pass', 'Pass'], ['lauf', 'Lauf'], ['trick', 'Trick'], ['defense', 'Defense']].map(([v, t]) => `<option value="${v}" ${v === typ ? 'selected' : ''}>${t}</option>`).join('')}</select>
        <div class="werkzeuge" id="werkzeuge">${WERKZEUGE.map(([w, t]) => `<button data-w="${w}">${t}</button>`).join('')}</div>
        <div id="rollenWahl" class="reihe" style="margin-top:8px"></div>
        <div class="hinweisbox" id="tipp"></div>
        <div class="reihe">
          <button class="knopf zweit klein" id="rueck">↶ Rückgängig</button>
          <button class="knopf zweit klein" id="leeren">Wege leeren</button>
          <button class="knopf zweit klein" id="abspielen">▶ Abspielen</button>
        </div>
        <label class="klein leise" for="spNotiz" style="display:block;margin-top:10px">Notiz fürs Team</label>
        <textarea id="spNotiz" rows="2" maxlength="160" style="width:100%">${esc(notiz)}</textarea>
        <div class="reihe" style="margin-top:12px">
          <button class="knopf" id="speichern">💾 ${e ? 'Speichern' : 'Ins Playbook'}</button>
          <button class="knopf zweit" id="abbrechen">Abbrechen</button>
        </div>
        ${e && e.l ? '<p class="klein leise" style="margin-top:8px">Ihr bearbeitet einen Spielzug aus der Bibliothek – im Playbook wird daraus eure eigene Version.</p>' : ''}
      </div>
    </div>`;

  const box = $('#feldBox');
  let svg;
  const zeichnen = () => { box.innerHTML = feld(spiel, { label: 'Editor' }); svg = box.querySelector('svg'); verbinden(); };
  const werkzeugeZeichnen = () => {
    el.querySelectorAll('[data-w]').forEach(b => b.classList.toggle('aktiv', b.dataset.w === werkzeug));
    $('#tipp').textContent = TIPPS[werkzeug];
    $('#rollenWahl').innerHTML = werkzeug === 'spieler' ? Object.keys(ROLLEN).map(r => `<button class="knopf klein ${r === rolle ? '' : 'zweit'}" data-r="${r}">${r === 'WR' ? 'R' : r}</button>`).join('') : '';
    el.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { rolle = b.dataset.r; werkzeugeZeichnen(); });
  };
  el.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { werkzeug = b.dataset.w; werkzeugeZeichnen(); });

  const svgPunkt = (ev) => { const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; const q = p.matrixTransform(svg.getScreenCTM().inverse()); return [Math.max(0, Math.min(100, q.x)), Math.max(0, Math.min(80, q.y))]; };
  const naechste = (p, nur) => {
    let best = -1, bd = 7;
    spiel.s.forEach((sp, i) => { if (nur && sp[0] !== nur) return; const d = Math.hypot(sp[1] - p[0], sp[2] - p[1]); if (d < bd) { bd = d; best = i; } });
    return best;
  };
  const wegEnde = (i) => { const eig = spiel.w.filter(w => w[0] === i && w[1] !== 'p'); if (!eig.length) return [spiel.s[i][1], spiel.s[i][2]]; const l = eig[eig.length - 1][2]; return l[l.length - 1]; };
  // Ramer-Douglas-Peucker: gezeichnete Linie vereinfachen
  function vereinfachen(pts, eps = 1.4) {
    if (pts.length < 3) return pts;
    const [a, b] = [pts[0], pts[pts.length - 1]];
    let maxD = 0, idx = 0;
    for (let i = 1; i < pts.length - 1; i++) {
      const d = Math.abs((b[1] - a[1]) * pts[i][0] - (b[0] - a[0]) * pts[i][1] + b[0] * a[1] - b[1] * a[0]) / (Math.hypot(b[0] - a[0], b[1] - a[1]) || 1);
      if (d > maxD) { maxD = d; idx = i; }
    }
    if (maxD > eps) return vereinfachen(pts.slice(0, idx + 1), eps).slice(0, -1).concat(vereinfachen(pts.slice(idx), eps));
    return [a, b];
  }
  const abstandZuWeg = (p, w) => {
    const pts = wegPunkte(w); let m = 99;
    for (let i = 1; i < pts.length; i++) {
      const [x1, y1] = pts[i - 1], [x2, y2] = pts[i], dx = x2 - x1, dy = y2 - y1;
      const t = Math.max(0, Math.min(1, ((p[0] - x1) * dx + (p[1] - y1) * dy) / (dx * dx + dy * dy || 1)));
      m = Math.min(m, Math.hypot(p[0] - (x1 + t * dx), p[1] - (y1 + t * dy)));
    }
    return m;
  };

  function verbinden() {
    let zug = null;
    svg.onpointerdown = (ev) => {
      ev.preventDefault();
      const p = svgPunkt(ev);
      if (werkzeug === 'bewegen') {
        const i = naechste(p);
        if (i >= 0) { merken(); zug = { art: 'bewegen', i, letzter: p }; svg.setPointerCapture(ev.pointerId); }
        return;
      }
      if (werkzeug === 'lauf' || werkzeug === 'ball' || werkzeug === 'pass') {
        const i = werkzeug === 'pass' ? naechste(p, 'QB') : naechste(p);
        if (i < 0) { $('#tipp').textContent = werkzeug === 'pass' ? 'Starte den Pass direkt beim QB.' : 'Starte direkt bei einer Person.'; return; }
        const start = werkzeug === 'pass' ? [spiel.s[i][1], spiel.s[i][2]] : wegEnde(i);
        zug = { art: 'zeichnen', i, pts: [start] };
        svg.insertAdjacentHTML('beforeend', `<polyline id="live" fill="none" stroke="${werkzeug === 'ball' ? '#ffd23f' : '#fff'}" stroke-width=".8" stroke-dasharray="${werkzeug === 'lauf' ? '' : '1.5 1'}"/>`);
        svg.setPointerCapture(ev.pointerId);
        return;
      }
      if (werkzeug === 'h' || werkzeug === 'f') { merken(); spiel.m.push([werkzeug, r1(p[0]), r1(p[1])]); zeichnen(); return; }
      if (werkzeug === 'spieler') { merken(); spiel.s.push([rolle, Math.round(p[0]), Math.round(p[1])]); zeichnen(); return; }
      if (werkzeug === 'zone') { const i = naechste(p, 'DB'); if (i >= 0) { merken(); spiel.s[i][3] = spiel.s[i][3] ? 0 : 1; zeichnen(); } return; }
      if (werkzeug === 'loeschen') {
        const mi = (spiel.m || []).findIndex(m => Math.hypot(m[1] - p[0], m[2] - p[1]) < 3.5);
        if (mi >= 0) { merken(); spiel.m.splice(mi, 1); return zeichnen(); }
        const i = naechste(p);
        if (i >= 0) {
          merken();
          spiel.s.splice(i, 1);
          spiel.w = spiel.w.filter(w => w[0] !== i).map(w => [w[0] > i ? w[0] - 1 : w[0], ...w.slice(1)]);
          return zeichnen();
        }
        let wi = -1, bd = 3;
        spiel.w.forEach((w, k) => { const d = abstandZuWeg(p, w); if (d < bd) { bd = d; wi = k; } });
        if (wi >= 0) { merken(); spiel.w.splice(wi, 1); zeichnen(); }
      }
    };
    svg.onpointermove = (ev) => {
      if (!zug) return;
      const p = svgPunkt(ev);
      if (zug.art === 'bewegen') {
        const dx = p[0] - zug.letzter[0], dy = p[1] - zug.letzter[1];
        zug.letzter = p;
        const sp = spiel.s[zug.i];
        sp[1] = r1(sp[1] + dx); sp[2] = r1(sp[2] + dy);
        spiel.w.forEach(w => { if (w[0] === zug.i && w[1] !== 'p') w[2] = w[2].map(([x, y]) => [r1(x + dx), r1(y + dy)]); });
        svg.querySelector(`.sp[data-s="${zug.i}"]`).setAttribute('transform', `translate(${sp[1]} ${sp[2]})`);
        return;
      }
      const l = zug.pts[zug.pts.length - 1];
      if (Math.hypot(p[0] - l[0], p[1] - l[1]) > 1.2) { zug.pts.push(p); $('#live').setAttribute('points', zug.pts.map(q => q.join(',')).join(' ')); }
    };
    svg.onpointerup = () => {
      if (!zug) return;
      if (zug.art === 'zeichnen' && zug.pts.length > 1) {
        merken();
        const art = werkzeug === 'lauf' ? 'l' : werkzeug === 'ball' ? 'b' : 'p';
        let pts = vereinfachen(zug.pts).map(([x, y]) => [Math.round(x), Math.round(y)]);
        if (art === 'p') pts = [pts[0], pts[pts.length - 1]];
        if (laenge(pts) > 2) spiel.w.push([zug.i, art, pts, art === 'p' || pts.length < 3 ? 0 : 1]);
      }
      if (zug.art === 'bewegen') spiel.s[zug.i] = spiel.s[zug.i].map((v, k) => (k === 1 || k === 2) ? Math.round(v) : v);
      zug = null;
      zeichnen();
    };
    svg.onpointercancel = () => { zug = null; zeichnen(); };
  }

  $('#rueck').onclick = () => { if (verlauf.length) { spiel = JSON.parse(verlauf.pop()); zeichnen(); } };
  $('#leeren').onclick = () => { merken(); spiel.w = []; spiel.m = []; zeichnen(); };
  $('#abspielen').onclick = () => animieren(svg, spiel);
  $('#abbrechen').onclick = () => { pbTab = 'mein'; playbookSeite(); };
  $('#speichern').onclick = () => {
    const n = $('#spName').value.trim().slice(0, 40) || `Spielzug ${pb.spiele.length + 1}`;
    const daten = { name: n, typ: $('#spTyp').value, s: spiel.s, w: spiel.w, m: spiel.m, info: $('#spNotiz').value.trim().slice(0, 160) };
    if (e) { pb.spiele[index] = { t: n, d: daten }; } else pb.spiele.push({ t: n, d: daten });
    pb.geaendert = Date.now(); sichern();
    pbTab = 'mein'; playbookSeite();
  };
  zeichnen();
  werkzeugeZeichnen();
}

// ---------- Teilen, QR, Verwalten ----------
async function teilenDialog() {
  const pb = aktuellesPB();
  const link = await linkErzeugen(pb);
  let qrHtml = '<p class="klein leise">QR-Code konnte nicht erstellt werden (offline?). Nutzt den Link.</p>';
  if (window.qrcode) {
    try { const q = qrcode(0, 'L'); q.addData(link); q.make(); qrHtml = `<div class="qr">${q.createSvgTag({ cellSize: 4, margin: 2, scalable: true })}</div>`; }
    catch { qrHtml = '<p class="klein leise">Das Playbook ist zu groß für einen QR-Code – nutzt den Link oder die Datei.</p>'; }
  }
  overlay.innerHTML = `<div class="innen karte" style="text-align:center">
    <h2>Playbook mitnehmen</h2>
    <p>Team-Code <span class="code">${esc(pb.code)}</span>${pb.team ? ` · ${esc(pb.team)}` : ''}</p>
    <p class="klein leise">Der Link enthält euer komplettes Playbook. Scannt den QR-Code mit einem anderen Handy, oder speichert den Link (z. B. als Lesezeichen oder Notiz). Es wird nichts auf einem Server gespeichert.</p>
    ${qrHtml}
    <div class="reihe" style="justify-content:center;margin-top:14px">
      <button class="knopf" id="kopieren">📋 Link kopieren</button>
      ${navigator.share ? '<button class="knopf zweit" id="share">📤 Teilen</button>' : ''}
      <button class="knopf zweit" id="datei">💾 Als Datei</button>
      <button class="knopf zweit" id="zu">Schließen</button>
    </div>
    <p class="klein leise" id="kopiert" style="margin-top:8px"></p></div>`;
  overlay.className = 'overlay an';
  $('#zu').onclick = () => { overlay.className = 'overlay'; };
  $('#kopieren').onclick = async () => { try { await navigator.clipboard.writeText(link); $('#kopiert').textContent = '✓ Link kopiert'; } catch { prompt('Link kopieren:', link); } };
  if (navigator.share) $('#share').onclick = () => navigator.share({ title: `Flag-Playbook ${pb.code}`, url: link }).catch(() => {});
  $('#datei').onclick = async () => {
    const blob = new Blob([JSON.stringify({ format: 'flag-playbook', code: await packen(pb) })], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `playbook-${pb.code}.json`; a.click(); URL.revokeObjectURL(a.href);
  };
}

function verwaltenDialog() {
  const codes = Object.values(D.playbooks).sort((a, b) => b.geaendert - a.geaendert);
  overlay.innerHTML = `<div class="innen karte">
    <h2>Playbooks auf diesem Gerät</h2>
    <table class="tab">${codes.map(p => `<tr><td><span class="code" style="font-size:1rem">${esc(p.code)}</span></td><td>${esc(p.team || '–')}</td><td>${p.spiele.length} Spielzüge</td>
      <td style="text-align:right">${p.code === D.aktiv ? '<b class="leise">aktiv</b>' : `<button class="knopf klein zweit" data-oeffnen="${esc(p.code)}">Öffnen</button>`}</td></tr>`).join('')}</table>
    <div class="reihe" style="margin-top:14px">
      <button class="knopf" id="neuPB">➕ Neues Playbook</button>
      <label class="knopf zweit" style="cursor:pointer">📂 Datei laden<input type="file" id="ladeDatei" accept=".json,application/json" hidden></label>
      <button class="knopf zweit" id="linkLaden">🔗 Link einfügen</button>
    </div>
    <h3 style="margin-top:16px">Gerät leeren</h3>
    <p class="klein leise">Löscht alle Playbooks auf diesem Gerät. Sichert vorher euren Link oder die Datei!</p>
    <div class="reihe"><button class="knopf rot" id="leeren">Alle löschen</button><button class="knopf zweit" id="zu">Schließen</button></div></div>`;
  overlay.className = 'overlay an';
  const zu = () => { overlay.className = 'overlay'; zeige('playbook'); };
  $('#zu').onclick = zu;
  overlay.querySelectorAll('[data-oeffnen]').forEach(b => b.onclick = () => { D.aktiv = b.dataset.oeffnen; sichern(); zu(); });
  $('#neuPB').onclick = () => { D.aktiv = null; aktuellesPB(); zu(); };
  $('#leeren').onclick = () => { if (confirm('Wirklich ALLE Playbooks auf diesem Gerät löschen?')) { D.playbooks = {}; D.aktiv = null; sichern(); zu(); } };
  $('#linkLaden').onclick = async () => {
    const l = prompt('Link zum Playbook einfügen:');
    const m = l && l.match(/#pb=([\w-]+)/);
    if (m) await importieren(m[1]); else if (l) alert('Das ist kein gültiger Playbook-Link.');
  };
  $('#ladeDatei').onchange = async (ev) => {
    try { const o = JSON.parse(await ev.target.files[0].text()); if (o.format !== 'flag-playbook') throw 0; await importieren(o.code); }
    catch { alert('Die Datei konnte nicht gelesen werden.'); }
  };
}

async function importieren(code) {
  try {
    const pb = await entpacken(code);
    const vorhanden = D.playbooks[pb.code];
    if (vorhanden && !confirm(`Auf diesem Gerät gibt es schon ein Playbook „${pb.code}“. Mit der Version aus dem Link überschreiben?`)) return;
    D.playbooks[pb.code] = pb; D.aktiv = pb.code; sichern();
    overlay.className = 'overlay';
    pbTab = 'mein';
    zeige('playbook');
  } catch { alert('Das Playbook konnte nicht geladen werden. Ist der Link vollständig?'); }
}

// ---------- Huddle & Druck ----------
function huddle(start) {
  const pb = aktuellesPB();
  if (!pb.spiele.length) { alert('Euer Playbook ist noch leer.'); return; }
  let i = start;
  const zeichnen = () => {
    const e = pb.spiele[i], d = spielDaten(e);
    overlay.innerHTML = `<div class="innen huddle">
      <div class="titelzeile"><span class="nummer">#${i + 1}</span><span class="name">${esc(spielName(e))}</span><button class="knopf zweit" id="zu" aria-label="Schließen">✕</button></div>
      ${feld(d, { label: spielName(e) })}
      ${d.info ? `<p style="margin-top:8px">${esc(d.info)}</p>` : ''}
      <div class="reihe" style="justify-content:center;margin-top:12px">
        <button class="knopf zweit" id="vor">◀</button><button class="knopf" id="play">▶ Abspielen</button><button class="knopf zweit" id="nach">▶▶</button>
      </div></div>`;
    overlay.className = 'overlay an';
    $('#zu').onclick = () => { overlay.className = 'overlay'; };
    $('#vor').onclick = () => { i = (i - 1 + pb.spiele.length) % pb.spiele.length; zeichnen(); };
    $('#nach').onclick = () => { i = (i + 1) % pb.spiele.length; zeichnen(); };
    $('#play').onclick = () => animieren(overlay.querySelector('svg'), d);
  };
  zeichnen();
}
function drucken() {
  const pb = aktuellesPB();
  if (!pb.spiele.length) { alert('Euer Playbook ist noch leer.'); return; }
  $('#druck').innerHTML = `<h2>Playbook ${esc(pb.team || '')} · Code ${esc(pb.code)}</h2><div class="karten">${pb.spiele.map((e, i) => `<div class="dk"><h3>#${i + 1} ${esc(spielName(e))}</h3>${feld(spielDaten(e), { klein: 1 })}</div>`).join('')}</div>`;
  setTimeout(() => window.print(), 100);
}

// ---------- Quiz ----------
const FRAGEN = [
  { f: 'Wie viele Punkte gibt es für einen Touchdown?', a: ['6', '3', '7', '2'] },
  { f: 'Was beendet im Flag Football einen Spielzug der Offense?', a: ['Der ballführenden Person wird die Flagge gezogen.', 'Die ballführende Person wird zu Boden gebracht.', 'Der QB ruft „Stopp“.', 'Nach 10 Sekunden.'] },
  { f: 'Wie heißt der Wurf des Centers durch die Beine zum QB?', a: ['Shotgun', 'Hand Off', 'Blitz', 'Fumble'] },
  { f: 'Was passiert, wenn ein Pass auf den Boden fällt?', a: ['Der Versuch ist sofort vorbei.', 'Wer den Ball zuerst hat, bekommt ihn.', 'Die Defense bekommt 2 Punkte.', 'Der Ball darf aufgehoben und weitergespielt werden.'] },
  { f: 'Wie viele Versuche (Downs) hat die Offense, um über die Mittellinie zu kommen?', a: ['4', '2', '3', 'Unbegrenzt'] },
  { f: 'Was ist ein „Blitz“?', a: ['Eine Person der Defense läuft nach dem Count direkt auf den QB zu.', 'Ein besonders schneller Pass.', 'Ein Lauf des QB.', 'Eine Strafe für Körperkontakt.'] },
  { f: 'Aus welchem Abstand zur Line of Scrimmage darf geblitzt werden?', a: ['Mindestens 7 m', 'Mindestens 2 m', 'Direkt an der Linie', 'Mindestens 15 m'] },
  { f: 'Welche Passroute geht gerade und schnell in die Tiefe?', a: ['Fly (Streak)', 'Hitch', 'Curl', 'Out'] },
  { f: 'Bei welcher Route läuft der Receiver nach vorne, dreht sich um und kommt zum QB zurück?', a: ['Curl', 'Post', 'Corner', 'Slant'] },
  { f: 'Was ist ein Vorteil der Zonendeckung?', a: ['Alle können gut mitverteidigen – Schwächen Einzelner fallen weniger ins Gewicht.', 'Sie ist am einfachsten zu verstehen.', 'Man muss am meisten laufen.', 'Man braucht keine Absprache.'] },
  { f: 'Was ist ein „Safety“ für die Defense?', a: ['2 Punkte, wenn die Offense in ihrer eigenen Endzone gestoppt wird.', 'Ein Pass hinter die Line of Scrimmage.', 'Eine Pause zum Trinken.', '6 Punkte nach einer Interception.'] },
  { f: 'Was ist beim Flagge-Ziehen richtig?', a: ['Augen auf Flagge oder Bauchnabel, Kopf oben, Arme vor dem Körper.', 'Kopf nach unten und Augen auf die Füße.', 'Mit dem ganzen Körper in die Person laufen.', 'Die Person am Trikot festhalten.'] },
  { f: 'Was gehört zu den No-Nos?', a: ['Die eigene Flagge mit der Hand schützen', 'Dem QB einen Pass zuwerfen', 'Die gezogene Flagge hochhalten', 'Im Huddle den Spielzug besprechen'] },
  { f: 'Wie fängst du einen Ball, der über Brusthöhe kommt?', a: ['Daumen und Zeigefinger bilden eine Raute, die Finger einen Korb.', 'Mit den Unterarmen wie beim Baggern.', 'Mit einer Hand von unten.', 'Mit geschlossenen Augen.'] },
  { f: 'Was ist eine „Interception“?', a: ['Die Defense fängt einen Pass ab.', 'Ein Pass, der ins Aus geht.', 'Eine Ballübergabe zum RB.', 'Ein Touchdown nach einem Lauf.'] },
  { f: 'Wie viele Punkte bringt der Extraversuch von der 5-m-Linie (nur Pass)?', a: ['1', '2', '3', '6'] },
];
function quizSeite() {
  const fragen = FRAGEN.map(q => ({ ...q, o: [...q.a].sort(() => Math.random() - 0.5) })).sort(() => Math.random() - 0.5).slice(0, 10);
  let i = 0, punkte = 0;
  const zeichnen = () => {
    if (i >= fragen.length) {
      D.quiz = Math.max(D.quiz || 0, punkte); sichern();
      bild.innerHTML = `<div class="karte" style="text-align:center"><h1 class="titel-schrift">${punkte} / ${fragen.length}</h1>
        <p>${punkte === fragen.length ? 'Touchdown! Alles richtig.' : punkte >= 7 ? 'Starke Leistung – fast perfekt.' : punkte >= 5 ? 'Gut! Schau dir die Begriffe nochmal an.' : 'Noch etwas Training nötig – probier es gleich nochmal.'}</p>
        <p class="leise klein">Bestes Ergebnis auf diesem Gerät: ${D.quiz} / ${fragen.length}</p>
        <div class="reihe" style="justify-content:center"><button class="knopf" id="nochmal">🔁 Nochmal</button><button class="knopf zweit" id="begriffe">📖 Begriffe</button></div></div>`;
      $('#nochmal').onclick = quizSeite; $('#begriffe').onclick = () => zeige('glossar');
      return;
    }
    const q = fragen[i];
    bild.innerHTML = `<div class="karte"><div class="reihe" style="justify-content:space-between"><span class="leise">Frage ${i + 1} von ${fragen.length}</span><span style="color:var(--gelb);font-weight:900">✔ ${punkte}</span></div>
      <div class="balken"><i style="width:${i / fragen.length * 100}%"></i></div>
      <h2>${q.f}</h2><div class="optionen">${q.o.map((o, k) => `<button class="option" data-k="${k}">${o}</button>`).join('')}</div><div id="fb"></div></div>`;
    bild.querySelectorAll('.option').forEach(b => b.onclick = () => {
      const richtig = q.o[+b.dataset.k] === q.a[0];
      bild.querySelectorAll('.option').forEach(x => { x.disabled = true; if (q.o[+x.dataset.k] === q.a[0]) x.classList.add('richtig'); });
      if (!richtig) b.classList.add('falsch'); else punkte++;
      $('#fb').innerHTML = `<div class="rueckmeldung ${richtig ? 'gut' : 'schlecht'}"><b>${richtig ? '✔ Richtig!' : '✘ Leider nicht.'}</b> ${richtig ? '' : 'Richtig ist: ' + q.a[0]}
        <div style="margin-top:10px"><button class="knopf" id="weiter">${i + 1 < fragen.length ? 'Weiter →' : 'Ergebnis'}</button></div></div>`;
      $('#weiter').onclick = () => { i++; zeichnen(); };
      $('#weiter').focus();
    });
  };
  zeichnen();
}

// ---------- Start ----------
(async () => {
  const m = location.hash.match(/#pb=([\w-]+)/);
  if (m) {
    history.replaceState(null, '', location.pathname);
    zeige('playbook');
    if (confirm('Ein geteiltes Playbook wurde geöffnet. Jetzt auf diesem Gerät speichern?')) await importieren(m[1]);
  } else zeige('start');
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
